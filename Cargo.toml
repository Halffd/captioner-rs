[workspace]
resolver = "2"
members = [
"crates/captioner-core",
"crates/captioner-log",
"crates/captioner-input",
"crates/captioner-web",
"crates/captioner-gui",
"crates/captioner-python",
"crates/captioner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Captioner Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
whisper-rs = "0.16"
webrtc-vad = "0.4"
hound = "3"
eframe = "0.29"
egui = "0.29"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
rdev = "0.5"
crossbeam-channel = "0.5"
rubato = "3.0"
lindera = { version = "3.0", default-features = false, features = ["embed-ipadic"] }
directories = "6"
tower-livereload = "0.10"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true